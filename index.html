<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS5 Emulator - Classic Layout</title>
<style>
  /* ========== BASE ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }

  /* ========== FUNDO ========== */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: url("background.png") center center / cover no-repeat;
    animation: kenburns 32s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1); }
    to   { transform: scale(1.05); }
  }

  /* ========== TELA INICIAL (START) ========== */
  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: rgba(0, 0, 0, 0.4);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #boot.hide { opacity: 0; visibility: hidden; }

  .start-container {
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    animation: pulse 2s infinite alternate;
  }
  .start-container:hover { transform: scale(1.1); transition: transform 0.2s; }
  
  .play-triangle { width: 80px; height: 80px; fill: #fff; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
  .start-text { font-size: 24px; font-weight: 600; letter-spacing: 0.5em; text-indent: 0.5em; margin-top: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.8); }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.05); opacity: 1; }
  }

  /* ========== INTERFACE DO EMULADOR (CONTROLES) ========== */
  #ui {
    position: fixed; inset: 0; z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
  }
  #ui.show { opacity: 1; pointer-events: auto; }

  /* Todos os elementos de controle */
  .ctrl-element {
    position: absolute;
    border: 2px solid #fff;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
  }

  /* L e R (Ombros) */
  .shoulder {
    width: 120px; height: 40px;
    border-radius: 0 0 20px 20px;
    font-size: 14px; font-weight: 600; letter-spacing: 2px;
  }
  .shoulder.left { top: 20px; left: 40px; border-top: none; transform: skewX(-15deg); }
  .shoulder.right { top: 20px; right: 40px; border-top: none; transform: skewX(15deg); }

  /* Direcional (D-Pad) */
  .d-pad {
    top: 50%; left: 8%; transform: translateY(-50%);
    width: 130px; height: 130px;
    border: none; box-shadow: none; background: transparent;
  }
  .d-pad-btn {
    position: absolute; width: 40px; height: 40px;
    border: 2px solid #fff; background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .d-pad-btn svg { width: 16px; height: 16px; fill: #fff; }
  .d-up { top: 0; left: 45px; border-radius: 8px 8px 0 0; border-bottom: none; }
  .d-down { bottom: 0; left: 45px; border-radius: 0 0 8px 8px; border-top: none; }
  .d-left { top: 45px; left: 0; border-radius: 8px 0 0 8px; border-right: none; }
  .d-right { top: 45px; right: 0; border-radius: 0 8px 8px 0; border-left: none; }
  .d-center { top: 45px; left: 45px; width: 40px; height: 40px; border: none; background: transparent; }

  /* Botões de Ação (Triângulo, Círculo, X, Quadrado) */
  .actions {
    top: 50%; right: 8%; transform: translateY(-50%);
    width: 140px; height: 140px; position: relative;
  }
  .action-btn {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid #fff; background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .action-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; }
  .btn-triangle { top: 0; left: 48px; }
  .btn-circle { top: 48px; right: 0; }
  .btn-cross { bottom: 0; left: 48px; }
  .btn-square { top: 48px; left: 0; }

  /* Analógico Esquerdo */
  .analog {
    bottom: 50px; left: 8%;
    width: 110px; height: 110px; border-radius: 50%;
    border: 3px solid #fff; background: transparent;
    position: absolute;
  }
  .analog-inner {
    width: 70px; height: 70px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.5);
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  }

  /* Botões Inferiores (Play, Select, Start) */
  .bottom-bar {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 20px;
  }
  .bottom-btn {
    padding: 8px 16px; border: 2px solid #fff; border-radius: 4px;
    background: transparent; font-size: 12px; font-weight: 600;
    letter-spacing: 2px; display: flex; align-items: center; gap: 8px;
  }
  .bottom-btn svg { width: 14px; height: 14px; fill: #fff; }
  .btn-play-icon { border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }

  /* Responsividade para telas menores */
  @media (max-width: 800px) {
    .shoulder { width: 80px; height: 30px; font-size: 10px; }
    .d-pad { transform: translateY(-50%) scale(0.7); left: 2%; }
    .actions { transform: translateY(-50%) scale(0.7); right: 2%; }
    .analog { transform: scale(0.7); bottom: 20px; left: 2%; }
    .bottom-bar { transform: translateX(-50%) scale(0.8); bottom: 20px; }
  }
</style>
</head>
<body>

  <!-- Fundo -->
  <div id="bg"></div>

  <!-- Tela Inicial -->
  <div id="boot">
    <div class="start-container" id="playBtn">
      <!-- Triângulo de Play -->
      <svg class="play-triangle" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <div class="start-text">START</div>
    </div>
  </div>

  <!-- Interface do Emulador -->
  <div id="ui">
    
    <!-- Ombros L e R -->
    <div class="ctrl-element shoulder left">L</div>
    <div class="ctrl-element shoulder right">R</div>

    <!-- Direcional (D-Pad) -->
    <div class="d-pad">
      <div class="d-pad-btn d-up"><svg viewBox="0 0 24 24"><path d="M12 4l8 12H4z"/></svg></div>
      <div class="d-pad-btn d-down"><svg viewBox="0 0 24 24"><path d="M12 20L4 8h16z"/></svg></div>
      <div class="d-pad-btn d-left"><svg viewBox="0 0 24 24"><path d="M4 12l12-8v16z"/></svg></div>
      <div class="d-pad-btn d-right"><svg viewBox="0 0 24 24"><path d="M20 12L8 20V4z"/></svg></div>
      <div class="d-center"></div>
    </div>

    <!-- Botões de Ação -->
    <div class="actions">
      <!-- Triângulo -->
      <div class="action-btn btn-triangle">
        <svg viewBox="0 0 24 24"><path d="M12 4l8 14H4z"/></svg>
      </div>
      <!-- Círculo -->
      <div class="action-btn btn-circle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
      </div>
      <!-- X (Cruz) -->
      <div class="action-btn btn-cross">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </div>
      <!-- Quadrado -->
      <div class="action-btn btn-square">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg>
      </div>
    </div>

    <!-- Analógico Esquerdo -->
    <div class="analog">
      <div class="analog-inner"></div>
    </div>

    <!-- Barra Inferior (Play, Select, Start) -->
    <div class="bottom-bar">
      <div class="bottom-btn btn-play-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="bottom-btn">SELECT</div>
      <div class="bottom-btn">START</div>
    </div>

  </div>

<script>
  const boot = document.getElementById('boot');
  const playBtn = document.getElementById('playBtn');
  const ui = document.getElementById('ui');

  // Configuração do Áudio
  const audio = new Audio('sound.mp3');
  audio.loop = true;   // Loop infinito
  audio.volume = 1.0;  // Volume máximo (bem alto)

  // Ação do Botão Play
  playBtn.addEventListener('click', () => {
    // Inicia a música
    audio.play().catch(error => {
      console.log("Erro ao tocar áudio. Verifique se o arquivo sound.mp3 existe e se o navegador permite autoplay.", error);
    });

    // Esconde a tela inicial e mostra os controles
    boot.classList.add('hide');
    ui.classList.add('show');
  }, { once: true }); // O evento só ocorre uma vez
</script>

</body>
</html>
