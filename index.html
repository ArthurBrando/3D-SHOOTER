<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS5 Emulator</title>
<style>
  /* ========== BASE ========== */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    color:#fff;
    background:#000;
    user-select:none;
  }

  /* ========== FUNDO ========== */
  #bg{
    position:fixed; inset:0; z-index:0;
    background:url("background.png") center center / cover no-repeat;
    animation:kenburns 32s ease-in-out infinite alternate;
  }
  @keyframes kenburns{
    from{ transform:scale(1); }
    to  { transform:scale(1.08); }
  }

  /* ========== TELA DE BOOT (PLAY) ========== */
  #boot{
    position:fixed; inset:0; z-index:30;
    display:grid; place-items:center;
    background:radial-gradient(circle at 50% 50%,
                rgba(0,0,0,.20) 0%,
                rgba(0,0,0,.55) 70%,
                rgba(0,0,0,.75) 100%);
    transition:opacity .9s ease, visibility .9s ease;
  }
  #boot.hide{ opacity:0; visibility:hidden; }

  .play{
    position:relative;
    width:clamp(96px, 15vmin, 140px);
    aspect-ratio:1/1;
    border-radius:50%;
    border:2px solid #fff;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:grid; place-items:center;
    cursor:pointer;
    animation:glow 2.6s ease-in-out infinite;
    transition:transform .3s ease, background .3s ease;
  }
  .play:hover{ transform:scale(1.08); background:rgba(255,255,255,.18); }
  .play:active{ transform:scale(.95); }
  .play svg{ width:40%; height:40%; fill:#fff; margin-left:9%; }

  .play::after{
    content:"";
    position:absolute; inset:-2px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.55);
    animation:ripple 2.6s ease-out infinite;
    pointer-events:none;
  }
  @keyframes ripple{
    0%  { transform:scale(1);   opacity:.8; }
    100%{ transform:scale(1.6); opacity:0;  }
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.35), 0 0 40px rgba(255,255,255,.15); }
    50%    { box-shadow:0 0 0 18px rgba(255,255,255,0), 0 0 70px rgba(255,255,255,.35); }
  }

  /* ========== INTERFACE DO EMULADOR ========== */
  #ui{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    opacity:0; transform:scale(1.03);
    pointer-events:none;
    transition:opacity 1s ease, transform 1.2s ease;
    background:linear-gradient(180deg,
                rgba(0,0,0,.60) 0%,
                rgba(0,0,0,.10) 35%,
                rgba(0,0,0,.10) 60%,
                rgba(0,0,0,.75) 100%);
  }
  #ui.show{ opacity:1; transform:scale(1); pointer-events:auto; }

  /* --- Barra superior --- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:24px 36px;
    opacity:0; transform:translateY(-14px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #ui.show .topbar{ opacity:1; transform:none; transition-delay:.15s; }

  .user{ display:flex; align-items:center; gap:14px; }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    border:2px solid #fff;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
    display:grid; place-items:center;
    font-size:13px; font-weight:600; letter-spacing:.05em;
  }
  .user .name{ font-size:14px; font-weight:600; letter-spacing:.04em; }
  .user .status{
    display:flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.65);
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:#fff; box-shadow:0 0 8px #fff;
  }

  .topright{ display:flex; align-items:center; gap:18px; }
  .clock{
    font-size:14px; letter-spacing:.10em;
    color:rgba(255,255,255,.9);
  }
  .iconbtn{
    width:40px; height:40px; border-radius:50%;
    border:2px solid rgba(255,255,255,.85);
    background:transparent;
    display:grid; place-items:center;
    cursor:pointer;
    transition:background .25s ease, transform .25s ease;
  }
  .iconbtn:hover{ background:rgba(255,255,255,.18); transform:scale(1.08); }
  .iconbtn svg{
    width:18px; height:18px;
    fill:none; stroke:#fff; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
  }

  /* --- Palco central --- */
  .stage{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:0 32px;
    text-align:center;
    opacity:0; transform:translateY(20px);
    transition:opacity .9s ease, transform .9s ease;
  }
  #ui.show .stage{ opacity:1; transform:none; transition-delay:.35s; }

  .ps-logo{
    font-size:clamp(46px, 9vw, 92px);
    font-weight:200;
    letter-spacing:.22em;
    line-height:1;
    text-indent:.22em;
    text-shadow:0 0 40px rgba(255,255,255,.35);
  }
  .ps-title{
    margin-top:14px;
    font-size:clamp(14px, 2vw, 18px);
    font-weight:400;
    letter-spacing:.42em;
    text-transform:uppercase;
    text-indent:.42em;
    color:rgba(255,255,255,.9);
  }
  .ps-sub{
    margin-top:10px;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }

  /* --- Tiles (cards vazados) --- */
  .tiles{
    display:flex; flex-wrap:wrap; gap:16px;
    justify-content:center;
    margin-top:44px;
  }
  .tile{
    width:150px; height:92px;
    border:2px solid rgba(255,255,255,.75);
    border-radius:14px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:9px;
    cursor:pointer;
    transition:background .3s ease, transform .3s ease, border-color .3s ease;
  }
  .tile:hover{
    background:rgba(255,255,255,.16);
    border-color:#fff;
    transform:translateY(-6px);
  }
  .tile svg{
    width:24px; height:24px;
    fill:none; stroke:#fff; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .tile span{
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,.85);
  }

  /* --- Barra de controles (vazados) --- */
  .controls{
    display:flex; flex-wrap:wrap; gap:34px;
    justify-content:center; align-items:center;
    padding:0 32px 40px;
    opacity:0; transform:translateY(20px);
    transition:opacity .9s ease, transform .9s ease;
  }
  #ui.show .controls{ opacity:1; transform:none; transition-delay:.6s; }

  .ctrl{
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
  }
  .btn{
    width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,255,255,.9);
    background:transparent;
    display:grid; place-items:center;
    transition:background .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .btn svg{
    width:22px; height:22px;
    fill:none; stroke:#fff; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .ctrl:hover .btn{
    background:rgba(255,255,255,.18);
    transform:scale(1.12);
    box-shadow:0 0 22px rgba(255,255,255,.35);
  }
  .ctrl .lbl{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,.8);
  }

  /* ========== RESPONSIVO ========== */
  @media (max-width:640px){
    .topbar{ padding:18px 20px; }
    .user .name, .user .status{ display:none; }
    .clock{ font-size:12px; }
    .tiles{ gap:12px; margin-top:30px; }
    .tile{ width:118px; height:80px; }
    .controls{ gap:20px; padding-bottom:28px; }
    .btn{ width:40px; height:40px; }
    .btn svg{ width:18px; height:18px; }
    .ctrl .lbl{ display:none; }
  }
</style>
</head>
<body>

  <!-- Fundo -->
  <div id="bg"></div>

  <!-- Tela inicial com o botão de play -->
  <div id="boot">
    <button class="play" id="playBtn" aria-label="Iniciar">
      <svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>
    </button>
  </div>

  <!-- Interface do emulador -->
  <div id="ui">

    <!-- Barra superior -->
    <header class="topbar">
      <div class="user">
        <div class="avatar">P1</div>
        <div>
          <div class="name">Player_01</div>
          <div class="status"><span class="dot"></span>Online</div>
        </div>
      </div>

      <div class="topright">
        <span class="clock" id="clock">00:00</span>

        <button class="iconbtn" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
        </button>

        <button class="iconbtn" aria-label="Configurações">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1"/><circle cx="15" cy="12" r="2.1"/><circle cx="8" cy="17" r="2.1"/></svg>
        </button>

        <button class="iconbtn" aria-label="Desligar">
          <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
        </button>
      </div>
    </header>

    <!-- Conteúdo central -->
    <main class="stage">
      <div class="ps-logo">PS5</div>
      <div class="ps-title">PlayStation®5</div>
      <div class="ps-sub">Emulador · Demonstração</div>

      <div class="tiles">
        <div class="tile">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8.5 3.5v17"/></svg>
          <span>Biblioteca</span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span>Loja</span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="10" r="2.2"/><path d="M16 15.2c2.6.2 4.5 1.8 4.5 3.8"/></svg>
          <span>Amigos</span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v2a3 3 0 0 0 3 3"/><path d="M16 6h3v2a3 3 0 0 1-3 3"/><path d="M12 13v4"/><path d="M9 20h6"/></svg>
          <span>Trofeus</span>
        </div>
      </div>
    </main>

    <!-- Controles -->
    <footer class="controls">
      <div class="ctrl">
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></div>
        <span class="lbl">Confirmar</span>
      </div>
      <div class="ctrl">
        <div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></div>
        <span class="lbl">Voltar</span>
      </div>
      <div class="ctrl">
        <div class="btn"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11"/></svg></div>
        <span class="lbl">Opções</span>
      </div>
      <div class="ctrl">
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M12 5.5L19 18H5z"/></svg></div>
        <span class="lbl">Detalhes</span>
      </div>
    </footer>

  </div>

<script>
  const boot     = document.getElementById('boot');
  const playBtn  = document.getElementById('playBtn');
  const ui       = document.getElementById('ui');
  const clockEl  = document.getElementById('clock');

  // Áudio ambiente
  const audio = new Audio('sound.mp3');
  audio.loop   = true;
  audio.volume = 0.85;

  // Relógio da barra superior
  function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    clockEl.textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 15000);

  // Iniciar
  playBtn.addEventListener('click', () => {
    playBtn.disabled = true;

    // Toca o som (o clique do usuário libera o autoplay)
    audio.play().catch(() => {});

    // Some com a tela de play e revela a interface
    boot.classList.add('hide');
    ui.classList.add('show');
  }, { once:true });
</script>

</body>
</html>
